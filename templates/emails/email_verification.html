{% extends "emails/base.html" %}
{% block content %}
<h2>Verify Your Email Address</h2>
<p>Hi {{ user.first_name|default:user.email }},</p>
<p>Click the button below to verify your email address:</p>
<a href="{{ site_url }}/verify-email/?uid={{ uid }}&token={{ token }}" class="btn">Verify Email</a>
<p style="color:#888;font-size:13px;">This link expires in 24 hours. If you did not request this, please ignore.</p>
{% endblock %}
