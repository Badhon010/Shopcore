<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}ShopCore{% endblock %}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #333; }
  .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .header { background: #1a1a2e; color: #fff; padding: 32px 40px; }
  .header h1 { color: #fff; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .body { padding: 40px; }
  .footer { background: #f9f9f9; border-top: 1px solid #eee; padding: 24px 40px; text-align: center; color: #888; font-size: 13px; }
  .btn { display: inline-block; padding: 14px 28px; background: #e94560; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; margin: 16px 0; }
  .order-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  .order-table th { background: #f5f5f5; padding: 10px 12px; text-align: left; font-size: 13px; }
  .order-table td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
  .total-row td { font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <div class="header"><h1>ShopCore</h1></div>
  <div class="body">{% block content %}{% endblock %}</div>
  <div class="footer">
    &copy; ShopCore. All rights reserved.<br>
    You received this email because you have an account with us.
  </div>
</div>
</body>
</html>
