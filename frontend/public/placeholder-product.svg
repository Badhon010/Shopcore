<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- Neutral background -->
  <rect width="400" height="400" fill="#F1F5F9"/>

  <!-- Photo-frame icon, 96 × 72 px, centred at (200, 190) -->
  <!-- Frame border -->
  <rect x="152" y="154" width="96" height="72" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Sun / circle in top-left of frame -->
  <circle cx="171" cy="172" r="8" fill="#CBD5E1"/>

  <!-- Mountain silhouette (two peaks) that fills the lower part of the frame -->
  <path d="M158 220 L180 188 L200 210 L216 194 L242 220 Z" fill="#CBD5E1"/>

  <!-- Label below the frame -->
  <text
    x="200" y="258"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-size="13"
    letter-spacing="0.4"
    fill="#94A3B8"
  >No image available</text>
</svg>
