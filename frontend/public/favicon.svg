<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ShopCore">
  <defs>
    <linearGradient id="bag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E3A8A" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- Bag -->
  <g filter="url(#shadow)">
    <rect x="12" y="16" width="40" height="38" rx="9" fill="url(#bag)"/>

    <!-- Handle -->
    <path d="M22 18c0-6 4.5-10 10-10s10 4 10 10"
          fill="none"
          stroke="#fff"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Highlight -->
    <path d="M16 20h32v10c-8-5-18-7-32-5z"
          fill="url(#shine)"/>
  </g>

  <!-- Stylized S -->
  <path
    d="M39.5 26
       C36.5 23.5 30 23.5 27.5 26
       C25.5 28 26.5 30.5 30.5 31.5
       L34 32.3
       C38.5 33.3 40 35.3 39 38
       C37.8 41.5 34.5 43 30.5 43
       C27.5 43 24.8 42 22.8 40"
    fill="none"
    stroke="#fff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>